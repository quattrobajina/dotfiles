repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v4.5.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-yaml
        exclude: \.tmpl$
      - id: check-toml
        exclude: (\.tmpl$|^\.chezmoiexternal\.toml$)
      - id: check-added-large-files
      - id: check-json
        exclude: \.tmpl$
      - id: check-merge-conflict

  # Lua Format (StyLua)
  - repo: https://github.com/JohnnyMorganz/StyLua
    rev: v0.20.0
    hooks:
      - id: stylua
        # Only exclude boilerplate and templates, keep user-configs checked
        exclude: |
          (?x)^(
            \.tmpl$|
            dot_config/nvim/init\.lua$|
            dot_config/nvim/lua/lazy_setup\.lua$
          )

  # Shell Script Check (ShellCheck)
  - repo: https://github.com/shellcheck-py/shellcheck-py
    rev: v0.9.0.6
    hooks:
      - id: shellcheck
        # Skip files with chezmoi template syntax as they might be invalid Shell
        exclude: \.tmpl$


  # Secret Detection
  - repo: https://github.com/gitleaks/gitleaks
    rev: v8.18.2
    hooks:
      - id: gitleaks
